<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Wish</title>
  <style>
    :root {
      --rose: #f53d73;
      --deep-rose: #d91c48;
      --soft-pink: #ffe2eb;
      --ink: #5e1830;
      --white: #fff9fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 16%, rgba(255, 255, 255, 0.92), transparent 24rem),
        linear-gradient(140deg, #ffd1dc 0%, #fff4f7 47%, #ffc5d5 100%);
    }

    .stage {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 22px;
      isolation: isolate;
    }

    .photo-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(1.08);
      filter: blur(18px);
      transition:
        opacity 2600ms ease,
        transform 4200ms cubic-bezier(.16, 1, .3, 1),
        filter 3600ms ease;
      z-index: 1;
    }

    .opened .photo-wrap {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    .photo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      user-select: none;
      pointer-events: none;
    }

    .message {
      position: absolute;
      top: clamp(28px, 7vh, 86px);
      left: 50%;
      z-index: 4;
      width: min(86vw, 560px);
      transform: translate(-50%, -18px);
      text-align: center;
      opacity: 0;
      transition: opacity 800ms ease 280ms, transform 800ms ease 280ms;
      pointer-events: none;
    }

    .opened .message {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .message h1 {
      margin: 0;
      color: #9d1436;
      font-size: clamp(32px, 6vw, 64px);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 3px 18px rgba(255, 255, 255, 0.8);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #d91c48;
      font-size: clamp(17px, 2.6vw, 24px);
      font-weight: 700;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.9);
    }

    .message p {
      margin: 12px auto 0;
      max-width: 420px;
      color: #74152e;
      font-size: clamp(16px, 2.2vw, 21px);
      line-height: 1.35;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.9);
    }

    .typewriter,
    .message h1 {
      min-height: 9.5em;
      white-space: pre-line;
    }

    .message h1 {
      min-height: 2.1em;
    }

    .eyebrow.typewriter {
      min-height: 1.4em;
    }

    .typing::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -0.12em;
      background: #d91c48;
      animation: blink 720ms steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .petal-field {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }

    .petal {
      position: absolute;
      left: var(--start-x);
      top: -12vh;
      color: var(--color);
      font-size: var(--size);
      line-height: 1;
      opacity: 0;
      transform: translate3d(0, 0, 0) rotate(var(--spin));
      text-shadow: 0 7px 16px rgba(214, 29, 70, 0.18);
      animation: loveFall var(--duration) linear var(--delay) forwards;
    }

    @keyframes loveFall {
      0% {
        opacity: 0;
        transform: translate3d(0, -12vh, 0) rotate(var(--spin)) scale(0.72);
      }
      12% {
        opacity: 0.92;
      }
      82% {
        opacity: 0.86;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift-x), 116vh, 0) rotate(calc(var(--spin) + var(--turn))) scale(var(--end-scale));
      }
    }

    @media (max-width: 620px) {
      .photo {
        object-position: 35% center;
      }

      .message {
        top: 34px;
      }

      .message p {
        max-width: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-wrap,
      .message {
        transition: none;
      }

      .petal {
        animation-duration: 1ms;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <section class="photo-wrap" aria-hidden="true">
      <img class="photo" src="background.png" alt="Heart tree with flowing pink and red petals">

    </section>

    <section class="message" aria-live="polite">
      <p class="eyebrow typewriter" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="typewriter" id="wish"></p>
    </section>

    <div class="petal-field" id="petalField" aria-hidden="true"></div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const eyebrow = document.getElementById("eyebrow");
    const title = document.getElementById("title");
    const wish = document.getElementById("wish");
    const petalField = document.getElementById("petalField");
    let started = false;
    let petalTimer = null;
    let typeTimer = null;

    const eyebrowText = "Hey Gorgeous 🦋";
    const titleText = "Happy\nBirthday";
    const wishText = "May God bless you 🌿\nAnd give u many happiness 💞\nJust saying... you're pretty awesome 💗\nSending good vibes and maybe a wink 😉\nHope u have a great day today ❤️🤭";

    const loveSymbols = ["❤", "💗", "💖", "💕", "💞", "💘"];
    const loveColors = ["#ff2f69", "#e91b46", "#ff78a6", "#ff4f86", "#d91632"];

    function makeLoveSymbol() {
      const petal = document.createElement("span");
      const size = random(15, 34);
      const startX = random(-4, 100);
      const driftX = random(-14, 14);
      const symbol = loveSymbols[Math.floor(Math.random() * loveSymbols.length)];
      const color = loveColors[Math.floor(Math.random() * loveColors.length)];

      petal.className = "petal";
      petal.textContent = symbol;
      petal.style.setProperty("--size", `${size}px`);
      petal.style.setProperty("--start-x", `${startX}vw`);
      petal.style.setProperty("--drift-x", `${driftX}vw`);
      petal.style.setProperty("--duration", `${random(5.2, 9.5)}s`);
      petal.style.setProperty("--delay", `${random(0, 0.5)}s`);
      petal.style.setProperty("--spin", `${random(-45, 45)}deg`);
      petal.style.setProperty("--turn", `${random(90, 420)}deg`);
      petal.style.setProperty("--end-scale", random(0.65, 1.2).toFixed(2));
      petal.style.setProperty("--color", color);
      petalField.appendChild(petal);

      petal.addEventListener("animationend", () => petal.remove(), { once: true });
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function typeInto(element, text, speed = 42) {
      let index = 0;
      const letters = Array.from(text);
      element.textContent = "";
      element.classList.add("typing");

      return new Promise((resolve) => {
        typeTimer = window.setInterval(() => {
          element.textContent += letters[index];
          index += 1;

          if (index >= letters.length) {
            window.clearInterval(typeTimer);
            element.classList.remove("typing");
            resolve();
          }
        }, speed);
      });
    }

    async function typeWish() {
      await typeInto(eyebrow, eyebrowText, 54);
      await typeInto(title, titleText, 64);
      await typeInto(wish, wishText, 42);
      wish.classList.add("typing");
    }

    function openWish() {
      if (started) return;
      started = true;
      stage.classList.add("opened");
      window.setTimeout(typeWish, 1800);

      for (let index = 0; index < 36; index += 1) {
        window.setTimeout(makeLoveSymbol, 1200 + index * 80);
      }

      petalTimer = window.setInterval(() => {
        for (let index = 0; index < 4; index += 1) {
          makeLoveSymbol();
        }
      }, 520);
    }

    window.addEventListener("DOMContentLoaded", openWish);

    window.addEventListener("pagehide", () => {
      if (petalTimer) window.clearInterval(petalTimer);
      if (typeTimer) window.clearInterval(typeTimer);
    });
  </script>
</body>
</html>
